<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>boneIO — Service Unavailable</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .container {
      text-align: center;
      padding: 2rem;
    }
    h1 { color: #e94560; font-size: 2rem; margin-bottom: 0.5rem; }
    p { color: #a0a0b0; font-size: 1.1rem; }
    .retry { margin-top: 1.5rem; }
    .retry a {
      color: #0f3460;
      background: #e94560;
      padding: 0.6rem 1.5rem;
      border-radius: 6px;
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Service Unavailable</h1>
    <p>boneIO is starting up or temporarily unavailable.</p>
    <p>Please wait a moment and try again.</p>
    <div class="retry"><a href="/">Retry</a></div>
  </div>
</body>
</html>
