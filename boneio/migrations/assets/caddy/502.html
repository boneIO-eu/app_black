<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="3">
  <title>boneIO is starting…</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
           background: #1a1a2e; color: #e0e0e0; display: flex; justify-content: center;
           align-items: center; min-height: 100vh; margin: 0; }
    .c { text-align: center; padding: 2rem; }
    h1 { font-size: 2rem; margin-bottom: .5rem; }
    p { color: #a0a0b0; font-size: 1.1rem; }
    .spin { width: 2.5rem; height: 2.5rem; margin: 1.5rem auto 0; border-radius: 50%;
            border: .25rem solid #333; border-top-color: #e94560; animation: s 1s linear infinite; }
    @keyframes s { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="c">
    <h1 id="t">boneIO is starting…</h1>
    <p id="m">This page will open the panel by itself in a moment.</p>
    <div class="spin"></div>
  </div>
  <script>
    if ((navigator.language || "").toLowerCase().startsWith("pl")) {
      document.documentElement.lang = "pl";
      document.title = "boneIO startuje…";
      document.getElementById("t").textContent = "boneIO startuje…";
      document.getElementById("m").textContent = "Za chwilę ta strona sama otworzy panel.";
    }
  </script>
</body>
</html>
