# Installed by boneIO migration 1.5.13 as
# /etc/systemd/system/mosquitto.service.d/50-boneio-priority.conf
#
# boneio.service is ordered After=mosquitto.service, so mosquitto is directly on
# the controller's critical path — but it ran at the default CPUWeight of 100
# while dockerd, containerd and bb-usb-gadgets competed for the single AM335x
# core. The result was large boot-to-boot variance in when boneIO could start:
#
#   boot A: basic.target 31.9s -> mosquitto ready 36.5s -> boneIO exec 51.5s
#   boot B: basic.target 31.5s -> mosquitto ready 55.5s -> boneIO exec 55.6s
#
# Same image, same configuration, 19 s apart. Whatever gates boneIO has to be
# scheduled like boneIO, so give mosquitto the same weights.
[Service]
CPUWeight=1000
IOWeight=1000
