# Installed by boneIO migration 1.5.17 as
# /etc/systemd/system/user@1000.service.d/50-boneio-defer.conf
#
# Lingering (migration 1.5.16) keeps the per-user systemd manager alive so SSH
# logins do not pay its ~4.1s startup. The side effect is that it also starts at
# boot, and on a single-core AM335x it stole CPU from boneIO:
#
#   no lingering:                    I/O ready 65.3-66.7s, login after gap 6.9s
#   lingering, unordered:            I/O ready 71.1s,      login after gap 2.8s
#   lingering, After=boneio.service: I/O ready 72.3s       <- did NOT help
#
# After=boneio.service is useless here: boneio.service is Type=simple, so it is
# "active" the moment it execs (~50s) while its Python imports and hardware
# init run for another ~22s. The user manager started right into that window.
#
# multi-user.target is only reached once everything else has started, so
# ordering against it puts the user manager genuinely last.
#
# A login attempted before then waits for it. That is a deliberate trade: boot
# happens on every power cycle and delays real I/O, whereas logging in is
# occasional maintenance.
[Unit]
After=multi-user.target

[Service]
CPUWeight=20
IOWeight=20
