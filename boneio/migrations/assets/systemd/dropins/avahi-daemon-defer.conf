# Installed by boneIO migration 1.5.9 as
# /etc/systemd/system/avahi-daemon.service.d/50-boneio-defer.conf
#
# mDNS name resolution (boneio.local) is a discovery convenience. Deferred, not
# disabled, so .local resolution keeps working once the controller is up.
[Unit]
After=boneio.service

[Service]
CPUWeight=20
IOWeight=20
