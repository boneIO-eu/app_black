# Installed by boneIO migration 1.6.22 into apt-daily.service.d/ and
# apt-daily-upgrade.service.d/.
#
# The automatic security update runs while the controller is working. boneIO
# runs at CPUWeight=1000; this keeps apt and dpkg from competing with it on a
# single-core BeagleBone.
[Service]
CPUWeight=20
IOWeight=20
Nice=10
