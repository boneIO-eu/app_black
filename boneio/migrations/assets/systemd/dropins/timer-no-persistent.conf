# Installed by boneIO migration 1.5.11 into several <timer>.d/ directories.
#
# These timers ship with Persistent=true, which makes systemd fire every
# schedule missed while the machine was off — immediately, at boot, all at once.
# On a controller that is power-cycled rather than left running, that means
# housekeeping competes with startup on every boot.
#
# Measured contributions to one boot (systemd-analyze blame):
#   fstrim.service         19.2s
#   man-db.service          2.5s
#   e2scrub_reap.service    2.8s
#   dpkg-db-backup.service  1.3s
#   logrotate.service       0.5s
#   systemd-tmpfiles-clean  0.5s
#
# Persistent=false keeps the schedule but drops the catch-up burst: the job runs
# at the next genuine occurrence while the system is actually up.
# RandomizedDelaySec additionally spreads them so they never pile up together.
[Timer]
Persistent=false
RandomizedDelaySec=30m
