# Installed by boneIO migration 1.5.9 as
# /etc/systemd/system/bb-usb-gadgets.service.d/50-boneio-defer.conf
#
# bb-usb-gadgets took 24.6s on a BeagleBone Black, with ~5s of that visible in
# the kernel log as configfs-gadget setup. It is a convenience path (USB
# networking on 192.168.7.2, ttyGS0) and nothing about driving I/O depends on
# it, so it has no business competing with controller startup on a single core.
#
# Deferred rather than disabled, so the USB rescue path still comes up.
#
# NOTE on ordering cycles: adding After=boneio.service to a unit that is
# WantedBy=multi-user.target used to deadlock, because boneio.service itself
# declared After=multi-user.target. That was removed in migration 1.5.6, which
# eliminates the whole class of cycle. Verified with
# 'systemd-analyze verify default.target' — no cycles reported.
[Unit]
After=boneio.service

[Service]
# Single-core AM335x: yield to boneIO, which runs at CPUWeight=1000.
CPUWeight=20
IOWeight=20
