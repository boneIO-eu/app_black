[Unit]
# Installed before the package, so its postinst cannot start a stock Caddy on
# :80 or fight the container for 8443. The switch creates the marker.
ConditionPathExists=/etc/boneio/proxy-native

[Service]
RuntimeDirectory=boneio-proxy
RuntimeDirectoryMode=0750
RuntimeDirectoryPreserve=yes
UMask=0077
# The container ran with restart: unless-stopped and the package's unit has no
# Restart= at all. Backing off from 5 s to 2 min, as Docker does: never fast
# enough to trip systemd's start limit, which would leave the proxy dead until
# the next boot.
Restart=on-failure
RestartSec=5s
RestartSteps=5
RestartMaxDelaySec=2min
ExecStartPre=+/usr/lib/boneio/proxy-config
ExecStart=
ExecStart=/usr/bin/caddy run --environ --config /run/boneio-proxy/Caddyfile --adapter caddyfile
# After READY, when the first start has created the authority the Pre run could
# not export yet. "-": a failed export must never take a running proxy down.
ExecStartPost=-+/usr/lib/boneio/proxy-config --export-root
ExecReload=
# A reload keeps the authority even when the hostname changed: discarding it
# under a running Caddy is a start's job, as it was the container's.
ExecReload=+/usr/lib/boneio/proxy-config --reload
ExecReload=/usr/bin/caddy reload --config /run/boneio-proxy/Caddyfile --adapter caddyfile --address unix//run/boneio-proxy/admin.sock --force
# 8091 and 8443 are above 1024: no capability is needed at all.
AmbientCapabilities=
CapabilityBoundingSet=
NoNewPrivileges=yes
ProtectSystem=strict
ReadWritePaths=/var/lib/caddy
ProtectHome=yes
PrivateTmp=yes
PrivateDevices=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectControlGroups=yes
RestrictSUIDSGID=yes
MemoryDenyWriteExecute=yes
LockPersonality=yes
