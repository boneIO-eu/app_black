# boneIO: the text an SSH client shows before the password prompt. Managed by
# boneIO migration 1.6.28 - edit at your own risk. The first value sshd reads
# wins, and sshd_config includes this directory before its own
# "Banner /etc/issue.net", so this replaces the base image's banner without
# editing a file base-files owns.
Banner /etc/ssh/boneio-banner
