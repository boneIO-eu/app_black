# boneIO SSH login hardening. Installed by migration 1.6.4; edit at your own
# risk, as a later migration may replace it.
#
# The web login has been throttled since 1.6 (10 attempts per 5 minutes,
# counted per IP and per account). SSH was left on the stock settings, so
# guessing there was bounded only by patience.
#
# Nobody is locked out by this: key authentication and password authentication
# both keep working. There are simply three guesses per connection instead of
# six, and less time to make them in. Root has no reason to log in over SSH on
# this device — the panel's privileged operations go through sudo as boneio.
MaxAuthTries 3
LoginGraceTime 20
PermitRootLogin no
