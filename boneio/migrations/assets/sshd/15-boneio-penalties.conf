# boneIO SSH guessing penalty. Installed by migration 1.6.35; edit at your own
# risk, as a later migration may replace it.
#
# Password login stays on: people setting up from Windows with PuTTY rarely
# have a key, and a controller they cannot reach is worse than one they reach
# with a password. What it must not allow is guessing at network speed.
#
# sshd keeps the count itself (OpenSSH 9.8+), per source address, in memory —
# no log parser, no firewall rules, no extra daemon on a board with half a
# gigabyte of RAM. A connection that ends without a successful login costs its
# source five minutes in which sshd refuses it outright; repeated, the penalty
# adds up to an hour. Typing the password wrong and then right in the same
# connection costs nothing. Three guesses per connection (MaxAuthTries, in
# 10-boneio-hardening.conf) every five minutes is under nine hundred a day.
#
# The penalty is per address, so behind one NAT a stranger's guessing also
# keeps a colleague out for those minutes. The panel's own login is counted
# separately and is unaffected.
PerSourcePenalties authfail:300s max:3600s
