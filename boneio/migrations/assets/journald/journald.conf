[Journal]
# /var/log is a 128 MB tmpfs provided by log2ram (SIZE=128M in
# /etc/log2ram.conf), NOT the rootfs.
#
# The previous values were SystemMaxUse=300M and SystemKeepFree=300M. Asking
# journald to keep 300 MB free on a 128 MB filesystem is unsatisfiable by
# definition, so it rotated and discarded continuously. Two consequences seen
# on a live controller:
#
#   * `journalctl -b` returned 330 lines after 18 h of uptime and the entire
#     early-boot timeline was gone — making boot problems undiagnosable
#   * SSH and the serial getty both hung after the sshd banner, in PAM.
#     lastlog/wtmp/wtmpdb all write to /var/log. A fresh boot logged in fine;
#     the failure appeared only after hours of runtime.
#
# Budget for a 128 MB volume:
#   48M cap + 16M reserve leaves ~64 MB of headroom for dpkg.log, apt/,
#   log2ram.log, lastlog and wtmp.
Compress=yes
SystemMaxUse=24M
SystemKeepFree=16M
# Deliberately small, and not only to stay under SystemMaxUse.
#
# journald preallocates each journal file up to SystemMaxFileSize, so the files
# are sparse: mostly holes. log2ram then rsyncs /var/log to and from disk with
# '--no-whole-file', which forces the delta-transfer algorithm and makes rsync
# checksum the APPARENT size, holes included, on a 1 GHz single-core AM335x.
#
# Measured with SystemMaxFileSize=8M: 14 journal files, 11 MB allocated but
# 112 MB apparent. log2ram spent 18.3 s at boot rsyncing 134 MB of mostly
# zeros. At 2M the apparent size collapses to roughly the real size and
# log2ram drops to 7.0 s.
#
# 'journalctl --disk-usage' reports allocated bytes, so it shows none of this —
# use 'du --apparent-size' when judging log2ram cost.
SystemMaxFileSize=2M
MaxRetentionSec=2weeks

# Journal before /var/log is mounted lives in /run (tmpfs on 512 MB of RAM).
# Cap it so early-boot logging cannot squeeze the running system.
RuntimeMaxUse=16M
RuntimeKeepFree=32M
RuntimeMaxFileSize=4M
