# boneIO: warnings and errors on the serial console. Installed by migration
# 1.6.25; edit at your own risk, as a later migration may replace it.
#
# The debug UART shows the boot without anybody logging in, which is the point:
# the boneio account is locked by default, so the serial getty cannot be used
# to find out why a controller does not start. This adds what journald
# receives at warning level or worse to what the kernel already prints there.
[Journal]
ForwardToConsole=yes
TTYPath=/dev/ttyS0
MaxLevelConsole=warning
