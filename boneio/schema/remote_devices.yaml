    # ESPHome API Parameters
    esphome_api:
      type: dict
      required: False
      dependencies:
        protocol: ['esphome_api']
      meta:
        label: ESPHome API Settings
        description: |
          Native ESPHome API connection settings.
          Entities (switches, lights, covers) can be auto-discovered.
      schema:
        host:
          type: string
          required: True
          meta:
            label: Host
            description: "IP address or hostname of ESPHome device"
        port:
          type: integer
          required: False
          default: 6053
          meta:
            label: Port
        password:
          type: string
          required: False
          meta:
            label: API Password
            description: "Optional API password (if configured on ESPHome device)"
        encryption_key:
          type: string
          required: False
          meta:
            label: Encryption Key
            description: "Optional noise encryption key (base64 encoded)"
        switches:
          type: list
          required: False
          meta:
            label: Available Switches
            description: "List of switches discovered or manually configured"
          schema:
            type: dict
            schema:
              id:
                type: string
                required: True
                meta:
                  label: Switch ID (object_id)
              name:
                type: string
                required: False
                meta:
                  label: Switch Name
              key:
                type: integer
                required: False
                meta:
                  label: Entity Key (from discovery)
        lights:
          type: list
          required: False
          meta:
            label: Available Lights
            description: "List of lights discovered or manually configured"
          schema:
            type: dict
            schema:
              id:
                type: string
                required: True
                meta:
                  label: Light ID (object_id)
              name:
                type: string
                required: False
                meta:
                  label: Light Name
              key:
                type: integer
                required: False
                meta:
                  label: Entity Key (from discovery)
              supports_brightness:
                type: boolean
                required: False
                default: false
                meta:
                  label: Supports Brightness
              supports_color_temp:
                type: boolean
                required: False
                default: false
                meta:
                  label: Supports Color Temperature
              supports_rgb:
                type: boolean
                required: False
                default: false
                meta:
                  label: Supports RGB Color
              supports_rgbw:
                type: boolean
                required: False
                default: false
                meta:
                  label: Supports RGBW Color
              min_mireds:
                type: float
                required: False
                meta:
                  label: Min Color Temp (mireds)
              max_mireds:
                type: float
                required: False
                meta:
                  label: Max Color Temp (mireds)
        covers:
          type: list
          required: False
          meta:
            label: Available Covers
            description: "List of covers discovered or manually configured"
          schema:
            type: dict
            schema:
              id:
                type: string
                required: True
                meta:
                  label: Cover ID (object_id)
              name:
                type: string
                required: False
                meta:
                  label: Cover Name
              key:
                type: integer
                required: False
                meta:
                  label: Entity Key (from discovery)
              supports_position:
                type: boolean
                required: False
                default: false
                meta:
                  label: Supports Position
              supports_tilt:
                type: boolean
                required: False
                default: false
                meta:
                  label: Supports Tilt
        binary_sensors:
          type: list
          required: False
          meta:
            label: Available Binary Sensors
            description: |
              List of binary sensors to monitor from the ESPHome device.
              State changes trigger local actions (same as GPIO inputs).
          schema:
            type: dict
            schema:
              id:
                type: string
                required: True
                meta:
                  label: Binary Sensor ID (object_id)
                  description: "object_id of the binary sensor on the ESPHome device"
              name:
                type: string
                required: False
                meta:
                  label: Display Name
              key:
                type: integer
                required: False
                meta:
                  label: Entity Key (from discovery)
              input_id:
                type: string
                required: False
                meta:
                  label: Custom Input ID
                  description: |
                    Override auto-generated input ID ({device_id}_{sensor_id}).
                    Used in MQTT topics and action references.
              mode:
                type: string
                required: False
                default: "binary_sensor"
                allowed: ['binary_sensor', 'event']
                meta:
                  label: Mode
                  description: |
                    - binary_sensor: pressed/released events
                    - event: single/double/long click detection
              device_class:
                type: string
                required: False
                meta:
                  label: Device Class (for HA)
                  description: "e.g. door, motion, window, opening"
              area:
                type: string
                required: False
                meta:
                  label: Area (for HA)
              show_in_ha:
                type: boolean
                required: False
                default: true
                meta:
                  label: Show in Home Assistant
              inverted:
                type: boolean
                required: False
                default: false
                meta:
                  label: Invert state
              double_click_duration:
                type: integer
                required: False
                meta:
                  label: Double Click Window (ms)
                  description: "Time window to detect double click (event mode, default: 220ms)"
              long_press_duration:
                type: integer
                required: False
                meta:
                  label: Long Press Threshold (ms)
                  description: "Time to detect long press (event mode, default: 400ms)"
              sequence_mode:
                type: string
                required: False
                allowed: ['immediate', 'exclusive']
                meta:
                  label: Sequence Mode
              long_press_mqtt_mode:
                type: string
                required: False
                allowed: ['single', 'periodic']
                meta:
                  label: Long Press MQTT Mode
              enable_triple_click:
                type: boolean
                required: False
                default: false
                meta:
                  label: Enable Triple Click
              actions:
                type: dict
                required: False
                allow_unknown: True
                meta:
                  label: Actions
                  description: |
                    Actions to execute on state change.
                    Keys depend on mode:
                    - binary_sensor: pressed, released
                    - event: single, double, long
    
    # WLED Protocol Parameters
    wled:
      type: dict
      required: False
      dependencies:
        protocol: ['wled']
      meta:
        label: WLED Settings
        description: |
          WLED HTTP JSON API connection settings.
          Segments can be auto-discovered from the device.
      schema:
        host:
          type: string
          required: True
          meta:
            label: Host
            description: "IP address or hostname of WLED device (e.g. wled-salon.local)"
        port:
          type: integer
          required: False
          default: 80
          meta:
            label: Port
        segments:
          type: list
          required: False
          meta:
            label: Available Segments
            description: "List of LED segments discovered or manually configured"
          schema:
            type: dict
            schema:
              id:
                type: integer
                required: True
                meta:
                  label: Segment ID
              name:
                type: string
                required: False
                meta:
                  label: Segment Name
              start:
                type: integer
                required: False
                meta:
                  label: Start LED
              stop:
                type: integer
                required: False
                meta:
                  label: Stop LED
              len:
                type: integer
                required: False
                meta:
                  label: LED Count
              supports_rgb:
                type: boolean
                required: False
                default: true
                meta:
                  label: Supports RGB Color
        effects:
          type: list
          required: False
          meta:
            label: Available Effects
            description: "List of WLED effects discovered from the device"
          schema:
            type: dict
            schema:
              id:
                type: integer
                required: True
                meta:
                  label: Effect ID
              name:
                type: string
                required: True
                meta:
                  label: Effect Name
        palettes:
          type: list
          required: False
          meta:
            label: Available Palettes
            description: "List of WLED color palettes discovered from the device"
          schema:
            type: dict
            schema:
              id:
                type: integer
                required: True
                meta:
                  label: Palette ID
              name:
                type: string
                required: True
                meta:
                  label: Palette Name
    
