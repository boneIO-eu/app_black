type: dict
schema:
  action:
    type: string
    allowed: ['mqtt', 'output', 'cover', 'output_over_mqtt', 'cover_over_mqtt', 'remote_output', 'remote_cover']
    coerce: lower
    case_insensitive: true
  boneio_output:
    type: string
    required_if:
      action: ['output', 'group', 'output_over_mqtt']
    meta:
      label: Output ID
      description: |
        ID of the output to control. This should match the id/boneio_output defined in your output configuration.
  boneio_cover:
    type: string
    required_if:
      action: ['cover', 'cover_over_mqtt']
    meta:
      label: Cover ID
      description: |
        ID of the cover to control. This should match the id defined in your cover configuration.
  topic:
    type: string
    required_if:
      action: ['mqtt']
    forbidden_if:
      action: ['output', 'cover', 'mqtt_output', 'cover_over_mqtt', 'remote_output', 'remote_cover']
    meta:
      label: If mqtt action then topic to send
  action_cover:
    type: string
    required_if:
      action: ['cover', 'cover_over_mqtt', 'remote_cover']
    forbidden_if:
      action: ['output', 'mqtt', 'mqtt_output', 'remote_output']
    allowed: ['TOGGLE', 'OPEN', 'CLOSE', 'STOP', 'TOGGLE_OPEN', 'TOGGLE_CLOSE', 'TILT', 'TILT_OPEN', 'TILT_CLOSE']
    coerce: action_field
    default: TOGGLE
    case_insensitive: true
    meta:
      label: If cover action chosen then what action to perform.
  data:
    type: dict
    required: False
    default: {}
    meta:
      label: Extra data to send to function. Currently used only for cover tilt.
    schema:
      position:
        type: integer
        required: False
        meta:
          label: Position to set cover to
      tilt_position:
        type: integer
        required: False
        meta:
          label: Tilt position to set cover to. 0 means closed, 100 means opened.
  action_output:
    type: string
    required_if:
      action: ['output', 'output_over_mqtt', 'remote_output']
    forbidden_if:
      action: ['cover', 'mqtt', 'cover_over_mqtt', 'remote_cover']
    allowed: ['TOGGLE', 'ON', 'OFF', 'BRIGHTNESS_UP', 'BRIGHTNESS_DOWN', 'BRIGHTNESS_UP_CYCLE', 'BRIGHTNESS_DOWN_CYCLE', 'SET_BRIGHTNESS', 'CYCLE_COLOR', 'CYCLE_PRESET']
    coerce: action_field
    default: TOGGLE
    case_insensitive: true
    meta:
      label: If output action chosen then what action to perform.
      description: |
        For ESPHome lights, additional actions are available:
        - BRIGHTNESS_UP: Increase brightness by 10% (turns on at 10% if OFF)
        - BRIGHTNESS_DOWN: Decrease brightness by 10% (turns off at 10%)
        - BRIGHTNESS_UP_CYCLE: Like BRIGHTNESS_UP but wraps from 100% to 10%
        - BRIGHTNESS_DOWN_CYCLE: Like BRIGHTNESS_DOWN but wraps from 10% to 100%
        - SET_BRIGHTNESS: Set specific brightness (requires brightness field)
        - CYCLE_COLOR: Cycle through a list of RGB colors on each press (requires colors field)
        - CYCLE_PRESET: Cycle through a list of effects/presets on each press (requires presets field)
  action_mqtt_msg:
    type: string
    required_if:
      action: ['mqtt', 'output_over_mqtt', 'cover_over_mqtt']
    forbidden_if:
      action: ['output', 'cover', 'remote_output', 'remote_cover']
    meta:
      label: What message to send to mqtt topic
  boneio_id:
    type: string
    required_if:
      action: ['output_over_mqtt', 'cover_over_mqtt']
    forbidden_if:
      action: ['output', 'cover', 'mqtt', 'remote_output', 'remote_cover']
    meta:
      label: boneIO id to perform action on. Use only with action type `output_over_mqtt` or `cover_over_mqtt`.
  
  # Remote device actions - control outputs/covers on remote devices (BoneIO MQTT or ESPHome API)
  remote_device:
    type: string
    required_if:
      action: ['remote_output', 'remote_cover']
    forbidden_if:
      action: ['output', 'cover', 'mqtt', 'output_over_mqtt', 'cover_over_mqtt']
    meta:
      label: Remote Device ID
      description: |
        ID of the remote device (from remote_devices section).
        Works with both BoneIO (MQTT) and ESPHome (native API) devices.
        Example: "salon_boneio", "garage_esp"
  output_id:
    type: string
    required_if:
      action: ['remote_output']
    forbidden_if:
      action: ['output', 'cover', 'mqtt', 'output_over_mqtt', 'cover_over_mqtt', 'remote_cover']
    meta:
      label: Remote Output ID
      description: |
        ID of the output/switch/light on the remote device.
        For ESPHome: can be switch or light entity.
        Example: "relay_1", "light_kitchen", "ceiling_light"
  cover_id:
    type: string
    required_if:
      action: ['remote_cover']
    forbidden_if:
      action: ['output', 'cover', 'mqtt', 'output_over_mqtt', 'cover_over_mqtt', 'remote_output']
    meta:
      label: Remote Cover ID
      description: |
        ID of the cover on the remote device.
        Example: "cover_living_room", "blinds_bedroom"
  
  # Optional fields for ESPHome lights (used with remote_output when entity is a light)
  brightness:
    type: integer
    required: False
    min: 0
    max: 255
    meta:
      label: Brightness (0-255)
      description: |
        Brightness level for SET_BRIGHTNESS action or initial brightness for ON action.
        Only used for ESPHome light entities. 0 = off, 255 = full brightness.
  color_temp:
    type: integer
    required: False
    meta:
      label: Color Temperature (mireds)
      description: |
        Color temperature in mireds. Only for ESPHome lights with color temperature support.
        Lower values = cooler (bluer), higher values = warmer (yellower).
        Typical range: 153 (6500K cool) to 500 (2000K warm).
  rgb:
    type: list
    required: False
    meta:
      label: RGB Color [R, G, B]
      description: |
        RGB color as list [red, green, blue], each value 0-255.
        Only for ESPHome lights with RGB support.
        Example: [255, 0, 0] for red, [0, 255, 0] for green, [0, 0, 255] for blue.
  transition:
    type: timeperiod
    coerce: positive_time_period
    required: False
    meta:
      label: Transition Time
      description: "Time to transition to the new state. Only for ESPHome/WLED lights. Example: 500ms, 1s"
  
  # Cycle color/preset support
  colors:
    type: list
    required: False
    meta:
      label: Color List for CYCLE_COLOR
      description: |
        List of RGB colors to cycle through on each press.
        Each color is a list of [R, G, B] values (0-255).
        Only used when action_output is CYCLE_COLOR.
        Example: [[255, 0, 0], [0, 255, 0], [0, 0, 255]]
  presets:
    type: list
    required: False
    meta:
      label: Preset/Effect List for CYCLE_PRESET
      description: |
        List of effect names (ESPHome) or effect IDs (WLED) to cycle through on each press.
        For ESPHome: list of effect name strings, e.g. ["Rainbow", "Strobe", "Color Wipe"]
        For WLED: list of effect IDs (integers), e.g. [0, 9, 47]
        Only used when action_output is CYCLE_PRESET.
  
  # Repeat support for long press actions
  repeat:
    type: boolean
    required: False
    default: false
    meta:
      label: Repeat on Hold
      description: |
        When true, this action will be executed repeatedly while the button is held (long press).
        Only effective for actions under the 'long' click type.
        Example: brightness_up with repeat will increase brightness continuously while holding.
  repeat_interval:
    type: timeperiod
    coerce: positive_time_period
    required: False
    default: 800ms
    meta:
      label: Repeat Interval
      description: |
        Minimum interval between repeated executions.
        Only used when repeat is true. Default: 800ms.
        Minimum: 200ms (matches periodic event interval).
