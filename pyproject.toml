[project]
name = "boneio"
description = "Python App for BoneIO"
readme = "README.md"
dynamic = ["version"]
authors = [
    { name = "Paweł Szafer", email = "pszafer@gmail.com" },
]
dependencies = [
    "Adafruit-Blinka==8.66.2",
    "adafruit-circuitpython-ds18x20==1.4.6",
    "adafruit-circuitpython-mcp230xx==2.5.18",
    "adafruit-circuitpython-mcp9808==3.3.28",
    "adafruit-circuitpython-pct2075==1.1.25",
    "aiomqtt==2.4.0",
    "Cerberus==1.3.7",
    "colorlog==6.9.0",
    "luma-core==2.5.1",
    "luma-oled==3.14.0",
    "pymodbus==3.11.3",
    "pyserial-asyncio-fast==0.16",
    "PyYAML==6.0.3",
    "psutil==7.1.0",
    "adafruit-circuitpython-onewire==2.0.11",
    "w1thermsensor[async]==2.3.0",
    "adafruit-circuitpython-pca9685==3.4.19",
    "adafruit-circuitpython-pcf8575==1.0.11",
    "adafruit-circuitpython-typing==1.12.2",
    "fastapi==0.118.0",
    "pydantic==2.11.9",
    "hypercorn==0.17.3",
    "websockets==15.0.1",
    "python-jose[cryptography]==3.5.0",
    "qrcode==8.2",
    "gpiod==2.3.0"
]
requires-python = ">=3.13"
license = { text = "GNU General Public License v3.0" }

[project.urls]
Homepage = "https://boneio.eu"
Repository = "https://github.com/boneIO-eu/app_bbb"
Documentation = "https://boneio.eu/docs/intro/"
Changelog = "https://github.com/boneIO-eu/app_bbb/releases"

[project.scripts]
boneio = "boneio.bonecli:main"


[tool.pdm.dev-dependencies]
dev = [
    "black>=25.9.0",
    "isort>=6.1.0",
    "pre-commit>=4.3.0",
    "flake8>=7.3.0",
    "bandit>=1.8.6",
    "setuptools>=80.9.0",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["boneio*"]

[tool.setuptools.dynamic]
version = {attr = "boneio.version.__version__"}

[tool.black]
line-length = 88
exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | pdm/_vendor
  | tests/fixtures
)/
'''

[tool.isort]
profile = "black"
atomic = true
filter_files = true
known_first_party = ["boneio"]

[tool.pdm.scripts]
lint = "pre-commit run --all-files"
