[project]
name = "boneio"
description = "Python App for BoneIO"
readme = "README.md"
dynamic = ["version"]
authors = [
    { name = "Paweł Szafer", email = "pszafer@gmail.com" },
]
dependencies = [
    "smbus2==0.4.3",
    "aiomqtt==2.4.0",
    "aiohttp==3.14.3",
    "Cerberus==1.3.7",
    "colorlog==6.9.0",
    "luma-core==2.5.1",
    "luma-oled==3.14.0",
    "pymodbus==3.11.3",
    "pyserial-asyncio-fast==0.16",
    "PyYAML==6.0.3",
    "psutil==7.2.2",
    "w1thermsensor[async]==2.3.0",
    "fastapi==0.141.1",
    # Not used directly, and fastapi only asks for >=0.46.0 — which the
    # version carrying the advisory satisfies, so pip's default strategy would
    # leave an old one in place on a device that already has it. Same reason as
    # the anyio floor below.
    "starlette>=1.3.1",
    "pydantic==2.11.9",
    "hypercorn==0.18.0",
    "websockets==15.0.1",
    # PyJWT rather than python-jose. The panel signs one kind of token —
    # HS256 with a secret it holds — and python-jose brought ecdsa, rsa,
    # pyasn1 and six along for algorithms nothing here uses. ecdsa carries an
    # advisory with no fixed version and its maintainers have said there will
    # not be one, so the dependency could only ever be carried, not resolved.
    "PyJWT==2.14.0",
    "python-multipart==0.0.31",
    "qrcode==8.2",
    "gpiod==2.3.0",
    "requests==2.33.0",
    "packaging==25.0",
    "aioesphomeapi>=45.0.0",
    "zeroconf>=0.148.0",
    "canopen-asyncio>=2.4.1",
    # Not used directly. It arrives through starlette, which accepts anything
    # from 3.6.2 upwards, and pip's default upgrade strategy leaves a
    # satisfied dependency alone — so a controller that has carried an old
    # anyio since it was imaged would keep it through every update. The floor
    # is what makes the fix reach a device already in the field.
    "anyio>=4.14.2",
    # Also indirect — aioesphomeapi, noiseprotocol and PyJWT's backend all
    # want it, none with an upper bound on Linux. The advisory needs 50.0.0,
    # and without a floor pip leaves whatever a device was imaged with: one
    # here is still carrying 46.0.4.
    #
    # Marked for Linux because aioesphomeapi caps it below 49 on Intel macOS,
    # and a floor without the marker makes the resolution unsatisfiable there
    # rather than simply not applying. boneIO ships on Linux.
    "cryptography>=50.0.0; platform_system == 'Linux'",
]
requires-python = ">=3.13"
license = { text = "GNU General Public License v3.0" }

[project.urls]
Homepage = "https://boneio.eu"
Repository = "https://github.com/boneIO-eu/app_black"
Documentation = "https://boneio.eu/docs/intro/"
Changelog = "https://github.com/boneIO-eu/app_black/releases"

[project.scripts]
boneio = "boneio.bonecli:main"


[tool.pdm.dev-dependencies]
dev = [
    "ruff>=0.15.0",
    "pre-commit>=4.3.0",
    "bandit>=1.8.6",
    "setuptools>=80.9.0",
]
test = [
    # Independent implementation used only to cross-check boneio.core.utils.sun.
    # Deliberately not a runtime dependency — see the module docstring.
    "astral>=3.2",
    "pytest>=9.0.1",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    # What starlette.testclient runs on. Starlette 1.x tries httpx2 first and
    # only falls back to httpx with a deprecation warning, so plain httpx here
    # meant every TestClient test ran on the deprecated path. Nothing in boneio
    # imports either one directly — this exists solely for the test client.
    "httpx2>=2.13.0",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["boneio*"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.yaml", "*.yml", "*.ttf", "*.sh", "*.pem", "*.sig"]
"boneio.webui" = ["frontend-dist/**/*"]
"boneio.migrations" = [
    "assets/**/*",
    "assets/MANIFEST.sha256",
    # Every privileged helper, its sudoers fragment and the self-heal script.
    # A glob rather than a list: a helper missing from the wheel is a device
    # that cannot migrate, and that is not a failure worth risking on someone
    # remembering to add a line here.
    "bootstrap/**/*",
    # Signed plans and their signatures. The "*" glob above only matches files
    # directly in a package directory, not in subdirectories, so plans/ has to
    # be named here or the helper ships with nothing to verify.
    "plans/**/*",
]

[tool.setuptools.exclude-package-data]
# bootstrap/**/* would otherwise pull in bytecode left behind by py_compile.
"*" = ["**/__pycache__/*", "**/*.pyc"]

[tool.setuptools.dynamic]
version = {attr = "boneio.version.__version__"}

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
# E = pycodestyle errors, F = pyflakes, I = isort, UP = pyupgrade, B = bugbear
select = ["E", "F", "I", "UP", "B", "SIM"]
# Pragmatic ignores for existing codebase
ignore = [
    "E402",    # module import not at top — intentional in bonecli (boot timing)
    "E501",    # line too long — handled by formatter
    "E741",    # ambiguous variable name (l, O, I)
    "F401",    # unused imports — too many false positives during refactoring
    "F841",    # local variable assigned but never used
    "B008",    # function call in default argument
    "B905",    # zip without strict
    "SIM108",  # use ternary operator — readability preference
    "UP007",   # use X | Y for union — we already use it but some old code doesn't
]

[tool.ruff.lint.isort]
known-first-party = ["boneio"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.pdm.scripts]
lint = "ruff check boneio/"
format = "ruff format boneio/"
fix = "ruff check --fix boneio/"
manifest = "python scripts/generate_manifest.py"
check-imports = "python scripts/check_duplicate_imports.py boneio/"

[tool.pyright]
# BasedPyRight configuration - compatibility mode with PyRight
include = ["boneio", "tests"]
exclude = ["**/__pycache__", "**/node_modules"]
extraPaths = ["."]
# Use PyRight compatibility mode for fewer warnings
typeCheckingMode = "basic"
# Disable some strict checks for better compatibility
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownParameterType = false
reportUnknownLambdaType = false
reportUnknownArgumentType = false
reportUntypedFunctionDecorator = false
reportUntypedClassDef = false
reportUntypedFunctionDef = false
reportUntypedMethodSignature = false
reportUntypedProperty = false
reportUntypedNamedTuple = false
reportPrivateImportUsage = false
# Enable Python 3.13 features
pythonVersion = "3.13"
pythonPlatform = "Linux"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "hardware: tests requiring real hardware (deselect with '-m not hardware')",
    "slow: slow running tests (deselect with '-m not slow')",
    "integration: integration tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]
addopts = "-v --tb=short"
