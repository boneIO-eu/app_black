name: Tests

on:
  push:
    branches: [dev-debian13]
  pull_request:
    branches: [dev-debian13]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install PDM
        run: pip install pdm

      - name: Install dependencies
        run: pdm install --dev --no-lock

      - name: Run unit tests
        run: |
          pdm run pytest tests/unit -v --tb=short -m "not hardware"

      - name: Run tests with coverage
        run: |
          pdm run pytest tests/unit -v --cov=boneio --cov-report=xml --cov-report=term -m "not hardware"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
        continue-on-error: true

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install PDM
        run: pip install pdm

      - name: Install dependencies
        run: pdm install --dev --no-lock

      - name: Run linters
        run: |
          pdm run black --check boneio tests
          pdm run isort --check-only boneio tests
          pdm run flake8 boneio --count --select=E9,F63,F7,F82 --show-source --statistics
