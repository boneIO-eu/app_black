name: Tests

on:
  push:
    branches: [dev-debian13]
    tags: ['v*']
  pull_request:
    branches: [dev-debian13]
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: |
          pip install pytest pytest-asyncio pytest-cov
          pip install -e . --no-deps || true
          pip install aiomqtt pydantic PyYAML colorlog Cerberus psutil aiohttp smbus2 pymodbus

      - name: Run unit tests
        run: pytest tests/unit -v --tb=short -m "not hardware"

      - name: Run tests with coverage
        run: pytest tests/unit -v --cov=boneio --cov-report=xml --cov-report=term -m "not hardware"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
        continue-on-error: true

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install pnpm
        run: npm install -g pnpm@10

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
        working-directory: frontend

      - name: Run frontend unit tests
        run: pnpm test
        working-directory: frontend

