name: Publish BoneIO 🐍 distributions 📦 to PyPI

on:
  push:
    branches:
      - 'main'
      - 'dev'
    paths:
      - '**.py'
      - '**.tsx'
      - '**.ts'
      - 'frontend/**'
  pull_request:
    branches: [main]
  release:
    types:
      - created
      - edited

jobs:
  # Legacy build for v0.* tags (Python 3.7, Debian 10 compatibility)
  build-legacy:
    name: Build Legacy (Python 3.7) for v0.* tags
    runs-on: ubuntu-20.04
    if: startsWith(github.ref, 'refs/tags/v0.')
    steps:
      - uses: actions/checkout@master

      - uses: pdm-project/setup-pdm@v3
        name: Setup Python 3.7 and PDM
        with:
          python-version: 3.7
          architecture: x64
          version: 2.6.1
          enable-pep582: true

      - name: Install dependencies
        run: |
          python -m pip install -U twine PyYAML==6.0.1

      - name: Generate JSON Schemas
        run: |
          python boneio/helper/schema_converter.py

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build Frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Build Package
        run: |
          pdm build

      - name: Publish to PyPI
        run: |
          pdm plugin add pdm-publish
          pdm publish --password ${{ secrets.PYPI_API_TOKEN }}

  # Modern build for v1.* tags (Python 3.13+)
  build-modern:
    name: Build Modern (Python 3.13) for v1.* tags
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/v1.')
    steps:
      - uses: actions/checkout@v4

      - uses: pdm-project/setup-pdm@v4
        name: Setup Python 3.13 and PDM
        with:
          python-version: '3.13'
          architecture: x64
          enable-pep582: true

      - name: Install dependencies
        run: |
          python -m pip install -U twine PyYAML

      - name: Generate JSON Schemas
        run: |
          python boneio/core/config/schema_converter.py

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'  # Latest LTS
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build Frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Build Package
        run: |
          pdm build

      - name: Publish to PyPI
        run: |
          pdm plugin add pdm-publish
          pdm publish --password ${{ secrets.PYPI_API_TOKEN }}
