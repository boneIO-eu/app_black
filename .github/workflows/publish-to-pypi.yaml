name: Publish BoneIO 🐍 distributions 📦 to PyPI

on:
  push:
    tags:
      - 'v*'
  release:
    types:
      - created
      - edited

jobs:
  # Legacy build for v0.* tags (Python 3.7, Debian 10 compatibility)
  build-legacy:
    name: Build Legacy (Python 3.7) for v0.* tags
    runs-on: ubuntu-20.04
    if: startsWith(github.ref, 'refs/tags/v0.') || (github.event_name == 'release' && startsWith(github.event.release.tag_name, 'v0.'))
    steps:
      - uses: actions/checkout@master

      - uses: pdm-project/setup-pdm@v3
        name: Setup Python 3.7 and PDM
        with:
          python-version: 3.7
          architecture: x64
          version: 2.6.1
          enable-pep582: true

      - name: Install dependencies
        run: |
          python -m pip install -U twine PyYAML==6.0.1

      - name: Generate JSON Schemas
        run: |
          python boneio/helper/schema_converter.py

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build Frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      # TODO: Add 'Inject Cloud API Secret' step when cloud registration (PWA) branch is merged
      # sed -i 's/__BONEIO_MASTER_SECRET_PLACEHOLDER__/secret/' boneio/core/cloud/secrets.py

      - name: Build Package
        run: |
          pdm build

      - name: Publish to PyPI
        run: |
          pdm plugin add pdm-publish
          pdm publish --password ${{ secrets.PYPI_API_TOKEN }}

  # Modern build for v1.* tags (Python 3.13+)
  build-modern:
    name: Build Modern (Python 3.13) for v1.* tags
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/v1.') || (github.event_name == 'release' && startsWith(github.event.release.tag_name, 'v1.'))
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install build tools
        run: |
          python -m pip install -U pip build twine PyYAML

      - name: Generate JSON Schemas
        run: |
          python boneio/core/config/schema_converter.py

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'  # Latest LTS
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build Frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      # TODO: Add 'Inject Cloud API Secret' step when cloud registration (PWA) branch is merged
      # sed -i 's/__BONEIO_MASTER_SECRET_PLACEHOLDER__/secret/' boneio/core/cloud/secrets.py

      - name: Build Package
        run: |
          python -m build

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          python -m twine upload dist/*
