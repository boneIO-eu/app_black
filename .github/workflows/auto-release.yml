name: Auto Release on Tag Push

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: create-release
  cancel-in-progress: false

jobs:
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for changelog generation

      - name: Get tag info
        id: tag_info
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          VERSION=${TAG#v}
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          # Check if prerelease (dev, alpha, beta, rc in version)
          if echo "$VERSION" | grep -qiE '(dev|alpha|beta|rc)'; then
            echo "prerelease=true" >> $GITHUB_OUTPUT
            echo "is_stable=false" >> $GITHUB_OUTPUT
          else
            echo "prerelease=false" >> $GITHUB_OUTPUT
            echo "is_stable=true" >> $GITHUB_OUTPUT
          fi

      - name: Find previous tag
        id: prev_tag
        run: |
          TAG="${{ steps.tag_info.outputs.tag }}"

          # Always find the previous STABLE tag (skip dev/alpha/beta/rc).
          # This gives dev releases a full cumulative changelog covering
          # all changes since the last stable release — identical to what
          # the final stable release will show.
          PREV_TAG=$(git tag --sort=-version:refname | grep -E '^v' | grep -viE '(dev|alpha|beta|rc)' | sed -n '2p')

          if [ -z "$PREV_TAG" ]; then
            # No previous stable tag found — try first stable tag
            PREV_TAG=$(git tag --sort=version:refname | grep -E '^v' | grep -viE '(dev|alpha|beta|rc)' | head -1)
          fi

          if [ -z "$PREV_TAG" ]; then
            # No stable tags at all, use first commit
            PREV_TAG=$(git rev-list --max-parents=0 HEAD)
          fi
          echo "prev_tag=$PREV_TAG" >> $GITHUB_OUTPUT
          echo "Previous tag: $PREV_TAG"

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG="${{ steps.prev_tag.outputs.prev_tag }}"
          TAG="${{ steps.tag_info.outputs.tag }}"

          # Check if RELEASE_NOTES.md exists — if so, use it as the release body
          if [ -f "RELEASE_NOTES.md" ]; then
            echo "Using RELEASE_NOTES.md for release body."
            cp RELEASE_NOTES.md changelog.md
            echo "" >> changelog.md
            echo "---" >> changelog.md
            echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${TAG}" >> changelog.md
          else
            echo "## What's Changed (since ${PREV_TAG})" > changelog.md
            echo "" >> changelog.md

            # Group changes by category (same format for stable and dev releases)
            FEATS=""
            FIXES=""
            REFACTORS=""
            DOCS=""
            PERFS=""
            OTHERS=""

            while IFS='|' read -r msg hash; do
              # Skip version bump / release commits
              if echo "$msg" | grep -qiE '^(bump version|release v|v[0-9])'; then
                continue
              fi
              # Skip build/chore commits
              if echo "$msg" | grep -qiE '^(build:|chore:)'; then
                continue
              fi

              lower_msg=$(echo "$msg" | tr '[:upper:]' '[:lower:]')
              if echo "$lower_msg" | grep -qE '^(feat|add|new|implement)'; then
                FEATS="${FEATS}- ${msg} (\`${hash}\`)\n"
              elif echo "$lower_msg" | grep -qE '^(fix|bug|patch|hotfix)'; then
                FIXES="${FIXES}- ${msg} (\`${hash}\`)\n"
              elif echo "$lower_msg" | grep -qE '^(perf)'; then
                PERFS="${PERFS}- ${msg} (\`${hash}\`)\n"
              elif echo "$lower_msg" | grep -qE '^(refactor|clean|rename)'; then
                REFACTORS="${REFACTORS}- ${msg} (\`${hash}\`)\n"
              elif echo "$lower_msg" | grep -qE '^(doc|readme)'; then
                DOCS="${DOCS}- ${msg} (\`${hash}\`)\n"
              elif echo "$lower_msg" | grep -qE '^(diag|test|style|i18n)'; then
                OTHERS="${OTHERS}- ${msg} (\`${hash}\`)\n"
              else
                OTHERS="${OTHERS}- ${msg} (\`${hash}\`)\n"
              fi
            done < <(git log "${PREV_TAG}..${TAG}" --pretty=format:"%s|%h" --no-merges)

            [ -n "$FEATS" ] && echo -e "### ✨ New Features\n\n${FEATS}" >> changelog.md
            [ -n "$FIXES" ] && echo -e "### 🐛 Bug Fixes\n\n${FIXES}" >> changelog.md
            [ -n "$PERFS" ] && echo -e "### ⚡ Performance\n\n${PERFS}" >> changelog.md
            [ -n "$REFACTORS" ] && echo -e "### ♻️ Refactoring\n\n${REFACTORS}" >> changelog.md
            [ -n "$DOCS" ] && echo -e "### 📝 Documentation\n\n${DOCS}" >> changelog.md
            [ -n "$OTHERS" ] && echo -e "### 📦 Other Changes\n\n${OTHERS}" >> changelog.md

            echo "" >> changelog.md
            echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${TAG}" >> changelog.md
          fi

          cat changelog.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_info.outputs.tag }}
          name: ${{ steps.tag_info.outputs.tag }}
          body_path: changelog.md
          prerelease: ${{ steps.tag_info.outputs.prerelease }}
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
