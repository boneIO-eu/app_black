# See https://pre-commit.com for more information
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-added-large-files
      - id: check-yaml
      - id: check-json

  # Ruff replaces black + isort + flake8 in a single, fast tool
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.10
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.6
    hooks:
      - id: bandit
        args:
          - --quiet
          - --format=custom
          - --configfile=tests/bandit.yaml
        files: ^(boneio)/.+\.py$

  # Auto-regenerate migration assets MANIFEST.sha256
  - repo: local
    hooks:
      - id: migration-manifest
        name: Regenerate migration MANIFEST.sha256
        language: script
        entry: scripts/update-migration-manifest.sh
        files: ^boneio/migrations/assets/
        exclude: MANIFEST\.sha256$
